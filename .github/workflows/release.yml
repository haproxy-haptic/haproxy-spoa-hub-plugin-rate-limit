name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign, and verify without creating a release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  sign:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      CERT_IDENTITY: https://github.com/haproxy-haptic/haproxy-spoa-hub-plugin-rate-limit/.github/workflows/release.yml@${{ github.ref }}
      CERT_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: artifacts
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: scripts/sign-release-artifacts.sh
      - name: Write SHA256SUMS
        run: |
          cd artifacts
          : > SHA256SUMS
          for f in *; do
            case "$f" in
              *.sha256 | *.cosign.bundle | SHA256SUMS) continue ;;
            esac
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS
      - name: Verify checksums and signatures
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS
          for f in *.sha256; do sha256sum --check "$f"; done
          awk '{print $2}' SHA256SUMS | while read -r f; do
            cosign verify-blob "$f" \
              --bundle "$f.cosign.bundle" \
              --certificate-identity "${CERT_IDENTITY}" \
              --certificate-oidc-issuer "${CERT_ISSUER}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

  release:
    needs: sign
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts
      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="${VERSION}" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1 }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          fi
          cat release-notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md artifacts/*
