[package]
name = "rate-limit-plugin"
version = "0.1.6"
edition = "2024"
rust-version = "1.86"
description = "Shared low-latency (local-first, lease-amortized) rate-limiting + quotas plugin for haproxy-spoa-hub"
license = "Apache-2.0"
repository = "https://gitlab.com/haproxy-haptic/haproxy-spoa-hub-plugin-rate-limit"

[lib]
# cdylib: the .so the hub dlopen's (librate_limit_plugin.so).
# rlib: so unit tests + benches can link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
haproxy-spoa-hub-plugin-api = "0.7"
log = "0.4"
# Async Valkey/Redis client for the shared-tier lease allocator. The per-request
# hot path stays synchronous + in-memory; fred is used only on the background
# lease-refresh path (see the design). Pooling + cluster + EVALSHA support.
fred = { version = "10", features = ["i-scripts", "sha-1", "sentinel-client"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
# Acceptance tests (tests/valkey_acceptance.rs) run against a real Valkey; they
# are gated on the VALKEY_URL env var (set by a services: valkey in CI).

[profile.release]
lto = true
codegen-units = 1
